name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mss pillow winocr deep-translator keyboard pyinstaller
      - run: pyinstaller --onefile --name screen_translator --collect-submodules winrt --collect-all winocr screen_translator.py
      - uses: actions/upload-artifact@v4
        with:
          name: screen_translator
          path: dist/screen_translator.exe
